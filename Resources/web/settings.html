<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="angl://theme.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="settings.css">
    <script defer src="common.js"></script>
    <script defer src="settings.js"></script>
    <title>Settings · angl</title>
  </head>
  <body class="settings-page">
    <div class="layout">
      <aside class="rail">
        <div class="wordmark">angl</div>
        <nav id="nav" aria-label="Settings sections"></nav>
      </aside>
      <main>
        <header class="settings-head">
          <h1 id="title" tabindex="-1">Settings</h1>
          <div class="searchbar" role="search">
            <label class="visually-hidden" for="search">Search settings</label>
            <input id="search" type="search" placeholder="Search settings" autocomplete="off" spellcheck="false" aria-describedby="search-hint">
            <kbd id="search-hint" aria-label="Command F">⌘F</kbd>
            <button id="modified" type="button" aria-pressed="false">Modified</button>
            <button id="clear" type="button" hidden>Clear filters</button>
          </div>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </header>
        <div id="content"></div>
        <div id="empty" class="empty" hidden>
          <p id="empty-text"></p>
          <button id="empty-clear" type="button">Clear filters</button>
        </div>
      </main>
    </div>
    <div class="toast"></div>
  </body>
</html>
