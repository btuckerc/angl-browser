<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="angl://theme.css">
    <link rel="stylesheet" href="base.css">
    <script defer src="common.js"></script>
    <script defer src="snapshots.js"></script>
    <title>Snapshots · angl</title>
  </head>
  <body>
    <main>
      <div class="row"><h1 style="flex:1;margin:0">Snapshots</h1><button id="take">Take snapshot ⇧⌘S</button><button id="import">Import…</button></div>
      <p class="muted">Every window, Space, folder and tab. Opening one adds its windows; nothing open is replaced.
        Automatic snapshots run every few minutes when something changed.</p>
      <table>
        <thead><tr><th style="width:170px">Taken</th><th>Contents</th><th style="width:60px"></th><th style="width:200px"></th></tr></thead>
        <tbody></tbody>
      </table>
    </main>
  </body>
</html>
